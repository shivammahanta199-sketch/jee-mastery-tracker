<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071012"><title>FPV FREERIDE // ACRO WORLD</title><link rel="stylesheet" href="./style.css"></head><body>
