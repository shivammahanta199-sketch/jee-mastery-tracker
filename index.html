<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quadwing Drone Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD in the corners and top-centre, sticks floating in the lower thirds, menus as glass-free solid panels. */
:root {
  --ink: #090c10;
  --panel: rgba(12, 16, 22, 0.78);
  --panel-2: rgba(22, 28, 36, 0.9);
  --line: rgba(255, 255, 255, 0.14);
  --line-2: rgba(255, 255, 255, 0.28);
  --text: #eef2f6;
  --dim: #95a2b1;
  --accent: #ffb020;
  --accent-ink: #1a1100;
  --ok: #52e08a;
  --bad: #ff5a47;
  --cool: #62d6ff;
  --display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body: 'Barlow Semi Condensed', 'Roboto Condensed', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--text);
  font: 500 15px/1.3 var(--body); overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- controls ---------- */
#controls { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.zone { position: absolute; top: 16%; bottom: 0; width: 46%; pointer-events: auto; touch-action: none; }
.zone.left { left: 0; } .zone.right { right: 0; }
.stick-base, .stick-knob { position: fixed; left: 0; top: 0; border-radius: 50%; pointer-events: none; will-change: transform; }
.stick-base { border: 2px solid rgba(255, 255, 255, 0.26); background: radial-gradient(circle, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015) 70%); transition: border-color 0.12s, background 0.12s; }
.stick-base .tick { position: absolute; background: rgba(255, 255, 255, 0.35); }
.stick-base .t, .stick-base .b { left: 50%; width: 2px; height: 9px; margin-left: -1px; }
.stick-base .t { top: 4px; } .stick-base .b { bottom: 4px; }
.stick-base .l, .stick-base .r { top: 50%; height: 2px; width: 9px; margin-top: -1px; }
.stick-base .l { left: 4px; } .stick-base .r { right: 4px; }
.stick-knob { background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.72); box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35); }
.zone.on .stick-base { border-color: var(--accent); background: radial-gradient(circle, rgba(255, 176, 32, 0.12), rgba(255, 176, 32, 0.02) 70%); }
.zone.on .stick-knob { background: rgba(255, 176, 32, 0.4); border-color: var(--accent); }
.stick-label { position: absolute; bottom: 6px; font: 600 10px/1 var(--display); letter-spacing: 0.16em; color: rgba(255, 255, 255, 0.4); }
.zone.left .stick-label { left: 18px; } .zone.right .stick-label { right: 18px; }
.actions { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; pointer-events: auto; z-index: 12; }
.act {
  min-width: 64px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: rgba(10, 14, 20, 0.62); border: 1px solid var(--line-2); border-radius: 10px; touch-action: none; cursor: pointer;
  transition: transform 0.08s, background 0.12s, border-color 0.12s;
}
.act b { font: 700 13px/1 var(--display); letter-spacing: 0.14em; }
.act small { font: 500 10px/1 var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
.act.down { transform: scale(0.94); background: rgba(255, 176, 32, 0.3); border-color: var(--accent); }
.act.lit { border-color: var(--accent); background: rgba(255, 176, 32, 0.18); }
.act.lit small { color: var(--accent); }
.act.acro small { color: var(--bad); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; font-family: var(--mono); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); }
#hud[hidden] { display: none; }
#hud.nohud .hud-opt { display: none; }
.hud-pad { position: absolute; inset: 0; padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.hud-tl { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; width: 148px; }
.hud-row { display: flex; align-items: center; gap: 8px; }
.lab { font: 600 10px/1 var(--display); letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }
.val { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.batt { display: flex; flex-direction: column; gap: 4px; }
.bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.18); }
.bar > i { display: block; height: 100%; width: 100%; background: var(--ok); transform-origin: left center; transition: background 0.2s; }
.bar.warn > i { background: var(--accent); } .bar.bad > i { background: var(--bad); }
.bar.pulse { animation: pulse 0.7s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.chip-mode { align-self: flex-start; padding: 3px 8px; border-radius: 4px; font: 700 12px/1 var(--display); letter-spacing: 0.16em; background: rgba(98, 214, 255, 0.18); border: 1px solid rgba(98, 214, 255, 0.6); color: var(--cool); }
.chip-mode.acro { background: rgba(255, 90, 71, 0.2); border-color: rgba(255, 90, 71, 0.8); color: #ff8a7a; }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.sig i { width: 3px; background: rgba(255, 255, 255, 0.25); border-radius: 1px; }
.sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 7px; } .sig i:nth-child(3) { height: 10px; } .sig i:nth-child(4) { height: 14px; }
.sig i.on { background: var(--text); } .sig.low i.on { background: var(--accent); } .sig.none i.on { background: var(--bad); }
.rotors { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px 4px; padding: 2px; }
.rotors i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 1px solid rgba(0, 0, 0, 0.4); }
.hull { display: flex; align-items: center; gap: 8px; }
.hull .bar { flex: 1; }

.hud-top { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
#tape { width: 250px; height: 26px; display: block; }
.zone-name { font: 600 11px/1 var(--display); letter-spacing: 0.22em; color: var(--text); text-transform: uppercase; opacity: 0.85; }

.hud-tr { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
.pausebtn { pointer-events: auto; width: 42px; height: 42px; border-radius: 10px; background: rgba(10, 14, 20, 0.62); border: 1px solid var(--line-2); display: grid; place-items: center; cursor: pointer; touch-action: none; }
.pausebtn i { width: 4px; height: 16px; background: var(--text); border-radius: 1px; margin: 0 2px; display: inline-block; }
#mini { pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--line-2); background: #0a1118; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4); cursor: pointer; touch-action: none; display: block; }
#mini.big { position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(78vh, 78vw); height: min(78vh, 78vw); border-radius: 12px; border-width: 2px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.55); }

.hud-l, .hud-r { position: absolute; top: 50%; transform: translateY(-84%); display: flex; flex-direction: column; gap: 10px; }
.hud-l { left: max(14px, env(safe-area-inset-left, 0px)); } .hud-r { right: max(14px, env(safe-area-inset-right, 0px)); align-items: flex-end; text-align: right; }
.read { display: flex; flex-direction: column; gap: 3px; }
.read .val { font-size: 19px; }
.read .unit { font: 500 10px/1 var(--mono); color: var(--dim); margin-left: 3px; }
.wind-arrow { width: 26px; height: 26px; display: inline-block; vertical-align: middle; }
.wind-arrow svg { width: 100%; height: 100%; transition: transform 0.2s linear; }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0.8; }
#cross::before, #cross::after { content: ''; position: absolute; background: var(--text); }
#cross::before { left: 10px; top: 0; width: 2px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%, 0 62%, 100% 62%, 100% 100%, 0 100%); }
#cross::after { top: 10px; left: 0; height: 2px; width: 22px; clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%, 62% 0, 100% 0, 100% 100%, 62% 100%); }
#horizon { position: absolute; inset: 0; width: 100%; height: 100%; }
.gps { font: 500 10px/1.35 var(--mono); color: var(--dim); }
.gps b { color: var(--text); font-weight: 500; }

#warn { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font: 700 22px/1 var(--display); letter-spacing: 0.2em; color: var(--bad); text-transform: uppercase; opacity: 0; transition: opacity 0.15s; text-align: center; white-space: nowrap; }
#warn.on { opacity: 1; animation: pulse 0.8s infinite; }
#hint { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); max-width: 70%; padding: 7px 14px; border-radius: 6px; background: rgba(10, 14, 20, 0.68); border: 1px solid var(--line); font: 600 14px/1.2 var(--body); letter-spacing: 0.02em; text-align: center; opacity: 0; transition: opacity 0.25s; }
#hint.on { opacity: 1; } #hint b { color: var(--accent); font-weight: 700; }
#banner { position: absolute; left: 50%; top: 27%; transform: translate(-50%, 6px); text-align: center; font: 700 clamp(26px, 6vw, 44px)/1.1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; }
#banner small { display: block; margin-top: 8px; font: 600 15px/1.2 var(--mono); letter-spacing: 0.06em; color: var(--accent); text-transform: none; }
#banner.on { opacity: 1; transform: translate(-50%, 0); }
.gate { display: flex; align-items: center; gap: 8px; padding: 4px 10px; margin-top: 2px; background: rgba(10, 14, 20, 0.62); border: 1px solid var(--line-2); border-radius: 6px; font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: pre; }
.gate[hidden] { display: none; }
#gateArrow { width: 18px; height: 18px; flex: none; }
#flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255, 60, 40, 0) 40%, rgba(255, 60, 40, 0.55)); opacity: 0; transition: opacity 0.45s ease-out; pointer-events: none; }
#flash.on { opacity: 1; transition: none; }
#toasts { position: absolute; z-index: 40; left: 50%; top: 88px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: 80%; }
.toast { padding: 8px 14px; border-radius: 6px; background: rgba(10, 14, 20, 0.85); border: 1px solid var(--line-2); font: 600 14px/1.2 var(--body); animation: toastIn 0.22s ease-out; text-align: center; }
.toast.warn { border-color: var(--accent); color: var(--accent); } .toast.bad { border-color: var(--bad); color: #ff8a7a; } .toast.ok { border-color: var(--ok); }
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }

/* ---------- developer panel ---------- */
#dev { position: absolute; z-index: 45; left: 50%; bottom: 74px; transform: translateX(-50%); padding: 8px 12px; background: rgba(0, 0, 0, 0.72); border: 1px solid var(--line-2); border-radius: 6px; font: 500 11px/1.5 var(--mono); color: #b9f5c8; pointer-events: none; white-space: pre; }
#dev[hidden] { display: none; }

/* ---------- menus ---------- */
#menus { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: auto; touch-action: pan-y; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; animation: fade 0.25s ease-out; }
.screen.show { display: block; }
@keyframes fade { from { opacity: 0; } }
.screen.scrim { background: rgba(5, 8, 12, 0.72); }
.screen.solid { background: radial-gradient(120% 90% at 20% 0%, #14202c 0%, #0a0e13 55%, #07090c 100%); }
.wrap { min-height: 100%; box-sizing: border-box; padding: max(18px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 18px max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 1040px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 clamp(30px, 6vw, 46px)/0.95 var(--display); letter-spacing: 0.12em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--dim); font: 500 13px/1.3 var(--body); letter-spacing: 0.04em; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.sec-title { font: 600 11px/1 var(--display); letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; margin: 0 0 8px; }
.drones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.dcard { text-align: left; padding: 10px 11px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; transition: border-color 0.12s, background 0.12s, transform 0.08s; }
.dcard:hover { border-color: var(--line-2); } .dcard:active { transform: scale(0.985); }
.dcard.sel { border-color: var(--accent); background: rgba(255, 176, 32, 0.09); }
.dcard h3 { margin: 0; font: 700 17px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; }
.dcard .tag { font: 500 12px/1.2 var(--body); color: var(--dim); }
.stat { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 6px; font: 600 9.5px/1 var(--display); letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
.stat .bar { height: 5px; } .stat .bar > i { background: var(--text); }
.dcard.sel .stat .bar > i { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font: 600 13px/1 var(--body); letter-spacing: 0.04em; min-height: 18px; }
.chip.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:active { transform: scale(0.97); }
.group { display: flex; flex-direction: column; gap: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { padding: 13px 22px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2); cursor: pointer; font: 700 15px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 17px; padding: 15px 30px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: #ff8a7a; }
.help { color: var(--dim); font: 500 12.5px/1.45 var(--body); }
.help b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 11.5px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; width: min(340px, 100%); }
.menu-list .btn { text-align: left; }
.pause-wrap { flex-direction: row; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; }
.pause-wrap h2 { margin: 0 0 10px; font: 700 34px/1 var(--display); letter-spacing: 0.18em; text-transform: uppercase; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; width: min(560px, 100%); }
@media (max-width: 640px) { .settings { grid-template-columns: minmax(0, 1fr); } }
.set { display: flex; flex-direction: column; gap: 6px; }
.set label { display: flex; justify-content: space-between; font: 600 11px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.set label output { font: 500 11px/1 var(--mono); color: var(--text); letter-spacing: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); margin-top: -8px; border: 0; }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 0; }
.switch { background: none; border: 0; padding: 0; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 600 11px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); cursor: pointer; min-height: 24px; }
.switch i { width: 40px; height: 22px; border-radius: 11px; background: rgba(255, 255, 255, 0.18); position: relative; transition: background 0.12s; flex: none; }
.switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform 0.12s; }
.switch.on i { background: var(--accent); } .switch.on i::after { transform: translateX(18px); background: var(--accent-ink); }
.dead h2 { margin: 0; font: 700 clamp(30px, 7vw, 54px)/1 var(--display); letter-spacing: 0.16em; color: var(--bad); text-transform: uppercase; }
.dead p { margin: 0; color: var(--dim); font: 500 15px/1.4 var(--body); max-width: 440px; }
.center { align-items: center; text-align: center; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; z-index: 50; background: #07090c; display: none; place-items: center; }
#loading.show { display: grid; }
.load-box { width: min(420px, 82vw); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.load-box svg { width: 160px; height: 80px; }
.load-box svg .prop { transform-box: fill-box; transform-origin: center; animation: spin 0.5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.load-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.14); border-radius: 2px; overflow: hidden; }
.load-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease-out; }
#loadStage { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; color: var(--dim); }
#fatal { position: absolute; inset: 0; z-index: 60; background: #07090c; display: none; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; touch-action: auto; }
#fatal.show { display: grid; }
#fatal div { max-width: 460px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
#fatal h2 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
#fatal p { margin: 0; color: var(--dim); line-height: 1.5; }
#rotate { position: absolute; inset: 0; z-index: 48; background: #07090c; display: none; place-items: center; text-align: center; font: 600 18px/1.4 var(--display); letter-spacing: 0.12em; text-transform: uppercase; padding: 24px; }
@media (orientation: portrait) and (max-width: 700px) { #rotate.active { display: grid; } }

@media (max-height: 420px) {
  .hud-tl { width: 128px; } .read .val { font-size: 16px; } .act { min-width: 56px; padding: 6px 6px 5px; } #mini { width: 80px; height: 80px; }
  .wrap { gap: 10px; } .btn.primary { padding: 12px 24px; }
}
@media (max-width: 700px) { .act { min-width: 54px; } #tape { width: 200px; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* Start screen on short landscape phones: four drones in one row, launch bar always reachable. */
.launchbar { position: sticky; bottom: 0; padding: 10px 0 2px; background: linear-gradient(to top, #0a0e13 70%, rgba(10, 14, 19, 0)); z-index: 2; }
@media (max-height: 480px) {
  .drones { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dcard { padding: 8px; gap: 5px; } .dcard h3 { font-size: 14px; } .dcard .tag { display: none; }
  .stat { grid-template-columns: 48px 1fr; font-size: 8.5px; }
  .brand p { display: none; } .wrap { justify-content: flex-start; gap: 10px; padding-top: 12px; }

      { id: 'roll', text: 'Push the right stick <b>sideways</b> to slide left or right', init: function (q, t) { t.acc = 0; }, done: function (q, t, dt) {

  // ======================================================= simulation

  G.processEvents = function (dt) {
    var q = G.quad, ev = q.events, pos = q.pos;
    G.toastGate -= dt;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.t === 'impact') {
        var kind = e.kind;
        G.audio.impact(e.v, kind);
        G.fx.sparks(pos[0], pos[1], pos[2], kind === 'light' ? 5 : 14, 2 + e.v * 0.4);
        G.rigKick = Math.max(G.rigKick || 0, U.clamp(e.v / 9, 0.1, 1));

          G.toastGate = 0.9;

          else if (kind === 'hard') G.toast('Hard impact: control reduced', 'bad');

        }
      } else if (e.t === 'rotorLost') { G.hud.warn('Rotor lost', 2200); }
      else if (e.t === 'battery') {
        G.audio.warn(e.level);
        if (e.level === 30) G.toast('Battery 30%. Plan your landing.', 'warn');
        else if (e.level === 20) G.toast('Battery 20%. Return and land.', 'warn');
        else if (e.level === 10) { G.toast('Battery 10%. Land now.', 'bad'); G.hud.warn('Low battery', 2500); }
        else if (e.level === 5) { G.toast('Critical battery. Thrust is failing.', 'bad'); G.hud.warn('Critical battery', 3000); }
        else if (e.level === 0) { G.hud.warn('Battery depleted', 3000); }
      } else if (e.t === 'destroyed') {
        G.audio.destroyed(); G.fx.sparks(pos[0], pos[1], pos[2], 40, 8);
        G.deadTimer = 1.8; G.deadWhy = e.why; G.hud.warn('Drone destroyed', 1800);
      } else if (e.t === 'disarm') {

  };

  G.fmtTime = function (t) { var m = Math.floor(t / 60), s = t - m * 60; return U.pad(m, 2) + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
  G.onRace = function (ev) {
    if (ev.type === 'gate') {
      G.audio.gate(false);
      if (ev.i === 0) G.hud.banner('Go!', 900);
      else if ((ev.i + 1) % 6 === 0) G.hud.banner(G.fmtTime(G.race.time) + '<small>gate ' + (ev.i + 1) + ' of ' + ev.total + '</small>', 1200);
    } else if (ev.type === 'finish') {
      var d = G.save.data, rec = d.progress.completed.gaterun || { best: 0, runs: 0 };
      var isBest = !rec.best || ev.time < rec.best, reward = 100 + Math.round(Math.max(0, ev.par - ev.time) * 3);
      rec.runs = (rec.runs || 0) + 1; if (isBest) rec.best = ev.time;

  // ======================================================= frame
  G.frame = function (now) {
